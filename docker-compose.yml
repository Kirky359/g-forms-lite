services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forms_secret}
      POSTGRES_DB: ${POSTGRES_DB:-forms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forms}:${POSTGRES_PASSWORD:-forms_secret}@db:5432/${POSTGRES_DB:-forms}
      PORT: 4000
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped


volumes:
  postgres_data: