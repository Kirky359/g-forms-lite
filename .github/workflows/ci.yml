name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Typecheck & Test ──────────────────────────────────────────────────────────
  ci:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # @forms/shared must be compiled before server/client can resolve its types
      - name: Build shared package
        run: npm run build --workspace=@forms/shared

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/server

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Test — server
        run: npm run test:cov --workspace=server

      # Vite bakes VITE_* vars at build time; unit tests don't call Firebase,
      # but the module graph still requires them to be defined.
      - name: Test — client
        run: npm run test:cov --workspace=client
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder

  # ─── Docker Build & Push ───────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: ci
    # Only push images on direct pushes to main, not on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      # Buildx is required for cache-from/cache-to support
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # built-in, no setup needed

      - name: Docker metadata — server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Docker metadata — client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/client
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          # Firebase vars are baked into the Vite bundle at build time
          build-args: |
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max